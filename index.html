<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>채팅 로그인</title>
</head>
<body>

<h2>로그인</h2>

<input type="text" id="code" placeholder="코드">
<input type="password" id="password" placeholder="비밀번호">

<button onclick="login()">로그인</button>

<hr>

<button onclick="firstUser()">처음 이용하기</button>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwlGTh7OgjkMF6Dvc7rKwcmZg4VJVNvbAFRyiuvGHaYtMpHfUhvHovvzaRSWkKciX5TYg/exec";

async function sha256(message){

  const msgBuffer = new TextEncoder().encode(message);

  const hashBuffer = await crypto.subtle.digest(
    'SHA-256',
    msgBuffer
  );

  const hashArray = Array.from(
    new Uint8Array(hashBuffer)
  );

  return hashArray
    .map(b => b.toString(16).padStart(2,'0'))
    .join('');
}

async function login(){

  const code = document.getElementById("code").value;
  const password = document.getElementById("password").value;

  if(code == "0"){
    alert("처음 이용하기 버튼을 누르세요");
    return;
  }

  const hash = await sha256(password);

  const res = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"login",
      realCode:code,
      passwordHash:hash
    })
  });

  const data = await res.json();

  if(data.success){

    localStorage.setItem("realCode", code);

    location.href = "chat.html";

  }else{
    alert("로그인 실패");
  }
}

async function firstUser(){

  const name = prompt("이름 입력");

  const res = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"registerTemp",
      name:name
    })
  });

  const data = await res.json();

  alert("임시코드: " + data.tempCode);

  localStorage.setItem(
    "tempCode",
    data.tempCode
  );

  location.href = "temp.html";
}

</script>

</body>
</html>
